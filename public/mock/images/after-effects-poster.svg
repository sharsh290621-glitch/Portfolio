<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="100%">
  <defs>
    <linearGradient id="ae-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1035" />
      <stop offset="100%" stop-color="#0F081C" />
    </linearGradient>
    <linearGradient id="curve-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9933FF" />
      <stop offset="50%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>
  </defs>

  <rect width="360" height="220" fill="url(#ae-bg)" />

  <!-- AE Logo Icon Top Left -->
  <rect x="18" y="16" width="24" height="24" rx="4" fill="#00005B" stroke="#9999FF" stroke-width="1.2" />
  <text x="30" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#9999FF" text-anchor="middle">Ae</text>
  
  <text x="50" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">AFTER EFFECTS</text>
  <text x="50" y="37" font-family="'JetBrains Mono', monospace" font-size="8" fill="#9C8BB8">COMP_01 • 120 FPS KINETIC</text>

  <!-- Speed Graph Curves / Motion Editor Interface -->
  <g transform="translate(18, 55)">
    <!-- Graph Background Grid -->
    <rect x="0" y="0" width="324" height="110" rx="6" fill="#130924" stroke="#2D1B4D" stroke-width="1" />
    
    <line x1="0" y1="28" x2="324" y2="28" stroke="#22133A" stroke-width="1" />
    <line x1="0" y1="55" x2="324" y2="55" stroke="#22133A" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="82" x2="324" y2="82" stroke="#22133A" stroke-width="1" />

    <!-- Bezier Easing Motion Curve -->
    <path d="M10,95 C70,95 80,15 150,15 C220,15 230,95 314,95" fill="none" stroke="url(#curve-grad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Bezier Handles -->
    <line x1="150" y1="15" x2="80" y2="15" stroke="#FFCC00" stroke-width="1.5" />
    <circle cx="80" cy="15" r="4" fill="#FFCC00" />
    <circle cx="150" cy="15" r="5" fill="#FFFFFF" stroke="#9933FF" stroke-width="2" />
    
    <line x1="150" y1="15" x2="220" y2="15" stroke="#FF3366" stroke-width="1.5" />
    <circle cx="220" cy="15" r="4" fill="#FF3366" />

    <!-- Keyframe Diamonds -->
    <polygon points="10,95 14,91 18,95 14,99" fill="#00D4FF" />
    <polygon points="306,95 310,91 314,95 310,99" fill="#00D4FF" />
  </g>

  <!-- Keyframe Timeline Bottom -->
  <g transform="translate(18, 178)">
    <rect x="0" y="0" width="324" height="24" rx="4" fill="#150B26" />
    <rect x="40" y="4" width="160" height="16" rx="3" fill="#6B21A8" fill-opacity="0.6" stroke="#A855F7" stroke-width="1" />
    <text x="48" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F3E8FF">Position / Scale Ease</text>
    
    <!-- Playhead -->
    <line x1="120" y1="-5" x2="120" y2="28" stroke="#EF4444" stroke-width="1.5" />
  </g>
</svg>
