<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="swavid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1015" />
      <stop offset="100%" stop-color="#1A1C24" />
    </linearGradient>
    <linearGradient id="swavid-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <linearGradient id="timeline-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="640" height="400" fill="url(#swavid-bg)" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="40" x2="640" y2="40" />
    <line x1="0" y1="80" x2="640" y2="80" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="160" x2="640" y2="160" />
    <line x1="0" y1="200" x2="640" y2="200" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="0" y1="280" x2="640" y2="280" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
  </g>

  <!-- App Header / Toolbar -->
  <rect x="0" y="0" width="640" height="38" fill="#14161F" />
  <circle cx="20" cy="19" r="4.5" fill="#FF5F56" />
  <circle cx="34" cy="19" r="4.5" fill="#FFBD2E" />
  <circle cx="48" cy="19" r="4.5" fill="#27C93F" />
  
  <rect x="75" y="10" width="130" height="18" rx="4" fill="#202330" />
  <text x="85" y="23" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8E95AA">Project_SwaVID_v4.ai</text>
  
  <rect x="520" y="9" width="105" height="20" rx="4" fill="#0055FF" />
  <text x="546" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#FFFFFF">RENDER 4K</text>
  
  <!-- Left Tool Sidebar -->
  <rect x="0" y="38" width="56" height="362" fill="#12131A" />
  <rect x="14" y="52" width="28" height="28" rx="6" fill="#0055FF" opacity="0.2" />
  <rect x="20" y="58" width="16" height="16" rx="3" fill="#0055FF" />
  <circle cx="28" cy="110" r="7" fill="#282C3D" />
  <rect x="21" y="138" width="14" height="14" rx="2" fill="#282C3D" />
  <polygon points="28,172 35,185 21,185" fill="#282C3D" />
  <rect x="21" y="208" width="14" height="14" rx="7" fill="#282C3D" />

  <!-- Main Viewport (Video/Canvas Player) -->
  <rect x="70" y="52" width="370" height="210" rx="8" fill="#0A0B0E" stroke="#25293A" stroke-width="1.5" />
  
  <!-- Video Scene Graphic in Player -->
  <circle cx="255" cy="140" r="60" fill="url(#swavid-glow)" opacity="0.8" filter="blur(20px)" />
  <circle cx="255" cy="145" r="45" fill="#0F111A" stroke="#0055FF" stroke-width="2" />
  <polygon points="250,132 268,145 250,158" fill="#0055FF" />
  
  <text x="86" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Neural Motion Synthesis</text>
  <text x="86" y="92" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00D4FF">FPS: 60.0 • 3840×2160 • ProRes 4444</text>

  <!-- Right Inspector Panel -->
  <rect x="454" y="52" width="172" height="210" rx="8" fill="#141620" stroke="#25293A" stroke-width="1" />
  <text x="468" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">PROPERTIES</text>
  
  <!-- Parameter Sliders -->
  <text x="468" y="100" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8E95AA">Diffusion Steps</text>
  <text x="596" y="100" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFFFFF">48</text>
  <rect x="468" y="106" width="144" height="4" rx="2" fill="#202434" />
  <rect x="468" y="106" width="96" height="4" rx="2" fill="#0055FF" />
  <circle cx="564" cy="108" r="4" fill="#FFFFFF" />

  <text x="468" y="134" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8E95AA">Guidance Scale</text>
  <text x="592" y="134" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFFFFF">7.5</text>
  <rect x="468" y="140" width="144" height="4" rx="2" fill="#202434" />
  <rect x="468" y="140" width="115" height="4" rx="2" fill="#00D4FF" />
  <circle cx="583" cy="142" r="4" fill="#FFFFFF" />

  <text x="468" y="168" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8E95AA">Camera Rig</text>
  <rect x="468" y="174" width="144" height="22" rx="4" fill="#1A1D2B" stroke="#2F354D" stroke-width="1" />
  <text x="478" y="189" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E2E6F2">Orbital 360° Smooth</text>

  <rect x="468" y="210" width="144" height="36" rx="4" fill="#0055FF" fill-opacity="0.15" stroke="#0055FF" stroke-width="1" />
  <text x="495" y="232" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#0055FF">GENERATE PREVIEW</text>

  <!-- Bottom Timeline Track Area -->
  <rect x="70" y="274" width="556" height="114" rx="8" fill="#13151E" stroke="#25293A" stroke-width="1" />
  
  <!-- Time ruler -->
  <g fill="#5F6782" font-family="'JetBrains Mono', monospace" font-size="8">
    <text x="82" y="290">00:00</text>
    <text x="180" y="290">00:04</text>
    <text x="280" y="290">00:08</text>
    <text x="380" y="290">00:12</text>
    <text x="480" y="290">00:16</text>
    <text x="580" y="290">00:20</text>
  </g>
  
  <!-- Timeline Tracks -->
  <rect x="80" y="298" width="536" height="22" rx="4" fill="#1B1E2B" />
  <rect x="120" y="301" width="220" height="16" rx="3" fill="url(#timeline-glow)" />
  <text x="130" y="313" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" fill="#FFFFFF">Track 01 • Neural_Subject_Main.mp4</text>

  <rect x="80" y="326" width="536" height="22" rx="4" fill="#1B1E2B" />
  <rect x="220" y="329" width="310" height="16" rx="3" fill="#7000FF" fill-opacity="0.8" />
  <text x="230" y="341" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" fill="#FFFFFF">Track 02 • VFX_Spatial_Displacement</text>

  <rect x="80" y="354" width="536" height="22" rx="4" fill="#1B1E2B" />
  <rect x="80" y="357" width="500" height="16" rx="3" fill="#00D4FF" fill-opacity="0.7" />
  <text x="90" y="369" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" fill="#0A0B0E">Audio • Master_Stereo_Mix_96k.wav</text>

  <!-- Playhead -->
  <line x1="280" y1="280" x2="280" y2="380" stroke="#FF3B30" stroke-width="2" />
  <polygon points="274,278 286,278 280,286" fill="#FF3B30" />
</svg>
